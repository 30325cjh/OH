name: Build Hanako APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393 ndk;27.0.12077973 cmake;3.22.1'
      - name: Fetch pinned MNN 3.6.1 Android runtime
        run: |
          mkdir -p /tmp/mnn-sdk mnn-android-sdk
          git -C /tmp/mnn-sdk init
          git -C /tmp/mnn-sdk remote add origin https://github.com/AdribMahmud101/mnn-android-sdk.git
          git -C /tmp/mnn-sdk fetch --depth 1 origin 5c8f61f47c1afedf86cd1ae79d6df358613c6436
          git -C /tmp/mnn-sdk checkout FETCH_HEAD
          cp -a /tmp/mnn-sdk/mnn-sdk mnn-android-sdk/mnn-sdk
      - name: Add MNN graph metadata inspection bridge
        run: python3 tools/patch_mnn_sdk.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk hanako.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hanako-apk
          path: hanako.apk
          if-no-files-found: error
