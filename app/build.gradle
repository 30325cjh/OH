plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.oh.hanako'
    compileSdk 35
    buildFeatures { buildConfig true }
    def geminiApiKey = System.getenv('GEMINI_API_KEY') ?: ''
    defaultConfig {
        applicationId 'com.oh.hanako'
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'GEMINI_API_KEY', '"' + geminiApiKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // MNN 3.6.1 native runtime + generic Android inference bridge.
    implementation project(':mnn-sdk')
}
